server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  location = /sitemap.xml {
    proxy_pass http://backend:8000/api/v1/public/sitemap.xml;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # HTML base do SPA, lido pelo backend para injetar meta tags/JSON-LD (SEO) nas páginas de evento
  location = /__shell.html {
    allow all;
    try_files /index.html =404;
  }

  # páginas de evento com meta tags no HTML inicial; se o backend falhar, serve o SPA normalmente
  location ~ ^/eventos/[^/]+$ {
    proxy_pass http://backend:8000/api/v1/public/ssr$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @spa;
  }

  location @spa {
    add_header Cache-Control "no-cache";
    rewrite ^ /index.html break;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
